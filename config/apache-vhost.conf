# GuruBot — VirtualHost Apache (XAMPP)
#
# Prasyarat modul di httpd.conf (hapus tanda # di depan LoadModule):
#   mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite
#
# Salin blok <VirtualHost> di bawah ke:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Pastikan di httpd.conf ada:
#   Include conf/extra/httpd-vhosts.conf
#
# Port 80 hanya boleh dipakai SATU web server — matikan nginx (GuruBot-Nginx)
# atau jangan jalankan Apache bersamaan dengan nginx bundle.
#
# Setelah edit, restart Apache dari XAMPP Control Panel.

<VirtualHost *:80>
    ServerName gurubot.sekolah
    ServerAlias www.gurubot.sekolah

    # Upload soal / media (sesuaikan jika perlu)
    LimitRequestBody 26214400

    ProxyPreserveHost On
    ProxyRequests Off

    # Next.js standalone (PM2 gurubot-app)
    ProxyPass / http://127.0.0.1:2050/
    ProxyPassReverse / http://127.0.0.1:2050/

    # WebSocket / HMR (jika dipakai)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:2050/$1 [P,L]

    ErrorLog "logs/gurubot-error.log"
    CustomLog "logs/gurubot-access.log" combined
</VirtualHost>
